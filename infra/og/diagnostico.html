<!doctype html>
<!--
  Source of public/og-diagnostico.jpg (share image for /diagnostico/).
  Same layout as og-default.jpg. Uses the locally installed Bebas Neue and Inter.
  Render: infra/og/render.sh
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #1A1A1A; color: #FAFAF7; font-family: 'Inter', sans-serif; position: relative; }
  .mono { position: absolute; right: -40px; top: 40px; font-family: 'Bebas Neue'; font-size: 560px; line-height: .8; color: #262626; letter-spacing: -10px; }
  .wrap { position: absolute; left: 80px; top: 78px; right: 80px; }
  .name { font-family: 'Bebas Neue'; font-size: 48px; letter-spacing: 1px; display: flex; align-items: center; gap: 20px; }
  .name i { width: 10px; height: 10px; background: #8DBE3F; display: inline-block; margin-bottom: 6px; }
  .rule { width: 72px; height: 5px; background: #8DBE3F; margin: 26px 0 22px; }
  h1 { font-family: 'Bebas Neue'; font-weight: 400; font-size: 96px; line-height: .95; white-space: nowrap; letter-spacing: .5px; }
  h1 span { color: #8DBE3F; }
  p { margin-top: 34px; font-size: 28px; font-weight: 600; line-height: 1.38; color: #C9C9C4; max-width: 820px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 76px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; letter-spacing: 1.2px; }
  .foot .l { color: #8A8A86; }
  .foot .r { color: #8DBE3F; letter-spacing: .4px; }
</style>
</head>
<body>
  <div class="mono">JC</div>
  <div class="wrap">
    <div class="name">JAVI CEBRIÁN <i></i></div>
    <div class="rule"></div>
    <h1>DIAGNÓSTICO IA + COMUNICACIÓN.<br /><span>EN 14 DÍAS.</span></h1>
    <p>Tres acciones con retorno estimado o no pagas.</p>
  </div>
  <div class="foot">
    <span class="l">PRECIO CERRADO · 1.500 €</span>
    <span class="r">javicebrian.es/diagnostico</span>
  </div>
</body>
</html>
